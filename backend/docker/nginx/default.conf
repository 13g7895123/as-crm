# ============================================
# Nginx Configuration for CodeIgniter 4
# ============================================
# 針對 CodeIgniter 4 優化的 Nginx 配置
# 支援 URL 重寫、FastCGI 快取、CORS 等

server {
    listen 8080;
    server_name localhost;

    root /var/www/html/public;
    index index.php index.html;

    # 日誌配置
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;

    # 客戶端上傳限制
    client_max_body_size 20M;
    client_body_timeout 60s;

    # Gzip 壓縮
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss application/rss+xml font/truetype font/opentype application/vnd.ms-fontobject image/svg+xml;

    # 安全標頭（開發環境使用寬鬆設定）
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # CORS 標頭（已在 CodeIgniter Filter 處理，這裡作為備用）
    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS, PATCH" always;
    add_header Access-Control-Allow-Headers "Authorization, Content-Type, Accept, Origin, X-Requested-With" always;
    add_header Access-Control-Max-Age "3600" always;

    # OPTIONS 請求直接返回 204
    if ($request_method = 'OPTIONS') {
        return 204;
    }

    # 健康檢查端點
    location = /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # 靜態資源快取
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # 拒絕訪問隱藏檔案
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # 拒絕訪問敏感檔案
    location ~ ^/(writable|tests|\.env|\.git) {
        deny all;
        return 404;
    }

    # CodeIgniter 4 URL 重寫規則
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # PHP-FPM 處理
    location ~ \.php$ {
        # 安全檢查：防止執行不存在的 PHP 檔案
        try_files $uri =404;

        # FastCGI 配置
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;

        # FastCGI 參數
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;

        # 超時設定
        fastcgi_connect_timeout 60s;
        fastcgi_send_timeout 60s;
        fastcgi_read_timeout 60s;

        # Buffer 設定
        fastcgi_buffer_size 32k;
        fastcgi_buffers 8 16k;
        fastcgi_busy_buffers_size 32k;

        # 快取設定（開發環境關閉）
        fastcgi_cache_bypass 1;
        fastcgi_no_cache 1;
    }

    # 拒絕直接訪問 composer 檔案
    location ~ ^/(composer\.json|composer\.lock|package\.json|package-lock\.json) {
        deny all;
        return 404;
    }
}
