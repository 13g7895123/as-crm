openapi: 3.0.3
info:
  title: CRM Order Management API
  description: API for managing orders in the CRM system
  version: 1.0.0
  contact:
    name: CRM Development Team

servers:
  - url: http://localhost:8080/api/v1
    description: Development Environment

tags:
  - name: orders
    description: Order management operations

paths:
  /orders:
    get:
      tags:
        - orders
      summary: List orders
      description: Retrieve a list of orders with pagination and filtering
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: per_page
          in: query
          schema:
            type: integer
            default: 20
        - name: customer_id
          in: query
          schema:
            type: integer
          description: Filter by customer
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, processing, completed, cancelled]
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Order'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'

    post:
      tags:
        - orders
      summary: Create order
      description: Create a new order
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
      responses:
        '201':
          description: Order created successfully

  /orders/{id}:
    get:
      tags:
        - orders
      summary: Get order details
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Order'

    put:
      tags:
        - orders
      summary: Update order
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateOrderRequest'
      responses:
        '200':
          description: Order updated successfully

    delete:
      tags:
        - orders
      summary: Delete order
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Order deleted successfully

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Order:
      type: object
      properties:
        id:
          type: integer
          example: 1
        order_no:
          type: string
          example: "ORD-20231001-001"
        customer_id:
          type: integer
          example: 1
        customer_name:
          type: string
          example: "TSMC"
        amount:
          type: number
          format: double
          example: 1500000.00
        order_date:
          type: string
          format: date
          example: "2023-10-01"
        status:
          type: string
          enum: [pending, processing, completed, cancelled]
          example: "completed"
        created_at:
          type: string
          format: date-time

    CreateOrderRequest:
      type: object
      required:
        - customer_id
        - amount
        - order_date
      properties:
        customer_id:
          type: integer
        amount:
          type: number
        order_date:
          type: string
          format: date
        items:
          type: array
          items:
            type: object
            properties:
              product_id:
                type: integer
              quantity:
                type: integer
              unit_price:
                type: number

    UpdateOrderRequest:
      type: object
      properties:
        amount:
          type: number
        status:
          type: string
          enum: [pending, processing, completed, cancelled]
        items:
          type: array
          items:
            type: object

    PaginationMeta:
      type: object
      properties:
        current_page:
          type: integer
        per_page:
          type: integer
        total:
          type: integer
        total_pages:
          type: integer
