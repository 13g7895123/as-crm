openapi: 3.0.3
info:
  title: CRM Customer Management API
  description: API for managing customers in the CRM system
  version: 1.0.0
  contact:
    name: CRM Development Team

servers:
  - url: http://localhost:8080/api/v1
    description: Development Environment

tags:
  - name: customers
    description: Customer management operations

paths:
  /customers:
    get:
      tags:
        - customers
      summary: List customers
      description: Retrieve a list of customers with pagination and filtering
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: per_page
          in: query
          schema:
            type: integer
            default: 20
        - name: search
          in: query
          schema:
            type: string
          description: Search by name, code, or contact
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Customer'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'

    post:
      tags:
        - customers
      summary: Create customer
      description: Create a new customer
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCustomerRequest'
      responses:
        '201':
          description: Customer created successfully

  /customers/{id}:
    get:
      tags:
        - customers
      summary: Get customer details
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Customer'

    put:
      tags:
        - customers
      summary: Update customer
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCustomerRequest'
      responses:
        '200':
          description: Customer updated successfully

    delete:
      tags:
        - customers
      summary: Delete customer
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Customer deleted successfully

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Customer:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: "TSMC"
        code:
          type: string
          example: "CUST001"
        contact:
          type: string
          example: "Mr. Chang"
        phone:
          type: string
          example: "0912-345-678"
        email:
          type: string
          example: "contact@tsmc.com"
        status:
          type: string
          enum: [active, inactive]
          example: "active"
        created_at:
          type: string
          format: date-time

    CreateCustomerRequest:
      type: object
      required:
        - name
        - contact
        - email
      properties:
        name:
          type: string
        code:
          type: string
        contact:
          type: string
        phone:
          type: string
        email:
          type: string
          format: email

    UpdateCustomerRequest:
      type: object
      properties:
        name:
          type: string
        contact:
          type: string
        phone:
          type: string
        email:
          type: string
        status:
          type: string
          enum: [active, inactive]

    PaginationMeta:
      type: object
      properties:
        current_page:
          type: integer
        per_page:
          type: integer
        total:
          type: integer
        total_pages:
          type: integer
