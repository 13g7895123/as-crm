openapi: 3.0.3
info:
  title: CRM Reports API
  description: API for retrieving reports and statistics
  version: 1.0.0
  contact:
    name: CRM Development Team

servers:
  - url: http://localhost:8080/api/v1
    description: Development Environment

tags:
  - name: reports
    description: Reporting and analytics operations

paths:
  /reports/dashboard:
    get:
      tags:
        - reports
      summary: Get dashboard statistics
      description: Retrieve key metrics for the dashboard
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      total_sales:
                        type: number
                        example: 4500000
                      new_customers:
                        type: integer
                        example: 12
                      pending_orders:
                        type: integer
                        example: 5
                      active_users:
                        type: integer
                        example: 25

  /reports/sales:
    get:
      tags:
        - reports
      summary: Get sales report
      description: Retrieve sales data over a period
      security:
        - bearerAuth: []
      parameters:
        - name: start_date
          in: query
          schema:
            type: string
            format: date
        - name: end_date
          in: query
          schema:
            type: string
            format: date
        - name: group_by
          in: query
          schema:
            type: string
            enum: [day, week, month]
            default: month
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        period:
                          type: string
                          example: "2023-10"
                        amount:
                          type: number
                          example: 1500000

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
