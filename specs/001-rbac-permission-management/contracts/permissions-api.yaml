openapi: 3.0.3
info:
  title: Permissions API
  description: RBAC 權限管理 API - 支援查詢系統權限和使用者權限檢查
  version: 1.0.0
  contact:
    name: CRM Development Team

servers:
  - url: http://localhost:8080/api/v1
    description: Development server

tags:
  - name: Permissions
    description: 權限查詢操作
  - name: User Permissions
    description: 使用者權限檢查

paths:
  /permissions:
    get:
      summary: 取得系統權限清單
      description: 取得所有可用的系統權限,按功能模組分組
      tags:
        - Permissions
      parameters:
        - name: module
          in: query
          description: 篩選特定功能模組的權限
          schema:
            type: string
            enum: [customer_management, order_management, report_center, role_management, user_management]
        - name: action
          in: query
          description: 篩選特定操作類型
          schema:
            type: string
            enum: [view, edit, export, assign]
      responses:
        '200':
          description: 成功取得權限清單
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/PermissionGroup'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /permissions/check:
    post:
      summary: 檢查使用者權限
      description: 檢查當前使用者是否擁有指定權限 (支援批次檢查)
      tags:
        - User Permissions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - permissions
              properties:
                permissions:
                  type: array
                  description: 需要檢查的權限清單 (格式: module:action)
                  items:
                    type: string
                  example: ["customer_management:view", "customer_management:edit", "order_management:export"]
                resource_context:
                  type: object
                  description: 資源上下文 (用於條件限制檢查)
                  properties:
                    department:
                      type: string
                    region:
                      type: string
                    customer_segment:
                      type: string
                  example:
                    region: "華東"
                    department: "業務部"
      responses:
        '200':
          description: 成功檢查權限
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    additionalProperties:
                      type: boolean
                    example:
                      "customer_management:view": true
                      "customer_management:edit": true
                      "order_management:export": false
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'

  /users/{userId}/permissions:
    get:
      summary: 取得使用者的所有權限
      description: 取得指定使用者的完整權限清單 (合併所有角色權限)
      tags:
        - User Permissions
      parameters:
        - name: userId
          in: path
          required: true
          description: 使用者 ID
          schema:
            type: integer
        - name: include_inherited
          in: query
          description: 是否包含從父角色繼承的權限
          schema:
            type: boolean
            default: true
      responses:
        '200':
          description: 成功取得使用者權限
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      user_id:
                        type: integer
                      roles:
                        type: array
                        description: 使用者擁有的角色清單
                        items:
                          $ref: '#/components/schemas/UserRole'
                      permissions:
                        type: array
                        description: 合併後的權限清單
                        items:
                          $ref: '#/components/schemas/PermissionDetail'
                      effective_condition_rules:
                        type: array
                        description: 生效中的條件限制規則
                        items:
                          $ref: '#/components/schemas/ConditionRule'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /my-permissions:
    get:
      summary: 取得當前使用者的權限
      description: 取得當前登入使用者的完整權限資訊 (用於「我的權限」頁面 - FR-031)
      tags:
        - User Permissions
      responses:
        '200':
          description: 成功取得當前使用者權限
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      user_id:
                        type: integer
                      user_name:
                        type: string
                      roles:
                        type: array
                        items:
                          $ref: '#/components/schemas/UserRole'
                      permissions_by_module:
                        type: object
                        description: 按功能模組分組的權限
                        additionalProperties:
                          type: array
                          items:
                            $ref: '#/components/schemas/PermissionDetail'
                        example:
                          customer_management:
                            - id: 1
                              module: customer_management
                              action: view
                              name: 檢視客戶資料
                              source: 業務人員
                          order_management:
                            - id: 5
                              module: order_management
                              action: view
                              name: 檢視訂單資料
                              source: 業務人員
                      condition_summary:
                        type: object
                        description: 條件限制摘要
                        properties:
                          department:
                            type: array
                            items:
                              type: string
                          region:
                            type: array
                            items:
                              type: string
        '401':
          $ref: '#/components/responses/Unauthorized'

components:
  schemas:
    PermissionGroup:
      type: object
      properties:
        module:
          type: string
          description: 功能模組
          example: customer_management
        module_name:
          type: string
          description: 功能模組顯示名稱
          example: 客戶管理
        permissions:
          type: array
          items:
            $ref: '#/components/schemas/Permission'

    Permission:
      type: object
      properties:
        id:
          type: integer
          example: 1
        module:
          type: string
          example: customer_management
        action:
          type: string
          enum: [view, edit, export, assign]
          example: view
        name:
          type: string
          example: 檢視客戶資料
        description:
          type: string
          nullable: true
          example: 允許檢視客戶基本資料和歷史記錄

    PermissionDetail:
      allOf:
        - $ref: '#/components/schemas/Permission'
        - type: object
          properties:
            source:
              type: string
              description: 權限來源角色名稱
              example: 業務人員
            is_inherited:
              type: boolean
              description: 是否為繼承權限
              example: false

    UserRole:
      type: object
      properties:
        role_id:
          type: integer
        role_name:
          type: string
          example: 業務人員
        valid_from:
          type: string
          format: date-time
          nullable: true
        valid_until:
          type: string
          format: date-time
          nullable: true
        is_expired:
          type: boolean
          description: 是否已過期
          example: false
        days_until_expiry:
          type: integer
          nullable: true
          description: 距離過期天數 (null 表示無過期時間)

    ConditionRule:
      type: object
      properties:
        id:
          type: integer
        role_name:
          type: string
          description: 來源角色名稱
        condition_type:
          type: string
          enum: [department, region, branch, customer_segment, order_status, amount_range]
          example: region
        operator:
          type: string
          enum: [equals, not_equals, in, not_in, greater_than, less_than, between]
          example: equals
        value:
          description: 條件值
          example: "華東"
        display_text:
          type: string
          description: 人類可讀的條件描述
          example: "區域 = 華東"

    Error:
      type: object
      properties:
        error:
          type: string
        message:
          type: string
        details:
          type: object
          additionalProperties: true

  responses:
    Unauthorized:
      description: 未授權 - 缺少或無效的 JWT token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: Unauthorized
            message: 請先登入系統

    Forbidden:
      description: 禁止存取 - 使用者無此權限
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: Forbidden
            message: 您沒有檢視其他使用者權限的權限

    NotFound:
      description: 資源不存在
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: Not Found
            message: 找不到指定的使用者

    ValidationError:
      description: 驗證錯誤
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
                example: Validation Error
              message:
                type: string
                example: 輸入資料驗證失敗
              details:
                type: object
                additionalProperties:
                  type: array
                  items:
                    type: string

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

security:
  - bearerAuth: []
