services:
  # MariaDB Database
  database:
    image: mariadb:10.6
    container_name: crm_db_dev
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_PORT}:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./docker/mysql-init/init-db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - crm_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend (CodeIgniter 4)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: crm_backend_dev
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT}:8080"
    volumes:
      - ./backend:/var/www/html
      - /var/www/html/vendor
    environment:
      CI_ENVIRONMENT: ${CI_ENVIRONMENT}
      DATABASE_HOST: ${DB_HOST}
      DATABASE_NAME: ${DB_NAME}
      DATABASE_USER: ${DB_USER}
      DATABASE_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_TIME_TO_LIVE: ${JWT_TIME_TO_LIVE}
      JWT_REFRESH_TIME_TO_LIVE: ${JWT_REFRESH_TIME_TO_LIVE}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
    depends_on:
      database:
        condition: service_healthy
    networks:
      - crm_network
    command: php -S 0.0.0.0:8080 -t public

  # Frontend (Nuxt 3)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: crm_frontend_dev
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT}:3000"
      - "${FRONTEND_HMR_PORT}:24678"  # Vite HMR
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.nuxt
    environment:
      NUXT_PUBLIC_API_BASE_URL: ${NUXT_PUBLIC_API_BASE_URL}
      NUXT_PUBLIC_APP_NAME: ${NUXT_PUBLIC_APP_NAME}
      NODE_ENV: development
    depends_on:
      - backend
    networks:
      - crm_network
    command: npm run dev

networks:
  crm_network:
    driver: bridge

volumes:
  db_data:
