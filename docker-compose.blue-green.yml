# ============================================
# CRM RBAC - Blue-Green Production Docker Compose
# ============================================
# 藍綠部署配置
#
# 使用方式：
#   藍色環境：DEPLOY_COLOR=blue docker compose -f docker-compose.blue-green.yml up -d
#   綠色環境：DEPLOY_COLOR=green docker compose -f docker-compose.blue-green.yml up -d
#
# 切換流量：修改 nginx upstream 指向
# ============================================

services:
  # ===========================================
  # MariaDB Database (共用)
  # ===========================================
  database:
    image: mariadb:10.6
    container_name: crm_db_prod
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
      - ./docker/mysql-init:/docker-entrypoint-initdb.d:ro
    networks:
      - crm_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1G

  # ===========================================
  # Backend - Blue Environment
  # ===========================================
  backend-blue:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: crm_backend_blue
    restart: always
    expose:
      - "9000"
    volumes:
      - ./backend/writable:/var/www/html/writable
      - ./backend/public/uploads:/var/www/html/public/uploads
    environment:
      CI_ENVIRONMENT: production
      DATABASE_HOST: database
      DATABASE_NAME: ${DB_NAME}
      DATABASE_USER: ${DB_USER}
      DATABASE_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_TIME_TO_LIVE: ${JWT_TIME_TO_LIVE:-3600}
      JWT_REFRESH_TIME_TO_LIVE: ${JWT_REFRESH_TIME_TO_LIVE:-604800}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      DEPLOY_COLOR: blue
    depends_on:
      database:
        condition: service_healthy
    networks:
      - crm_network
    healthcheck:
      test: ["CMD", "php", "-r", "echo 'healthy';"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
    profiles:
      - blue
      - all

  # ===========================================
  # Backend - Green Environment
  # ===========================================
  backend-green:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: crm_backend_green
    restart: always
    expose:
      - "9000"
    volumes:
      - ./backend/writable:/var/www/html/writable
      - ./backend/public/uploads:/var/www/html/public/uploads
    environment:
      CI_ENVIRONMENT: production
      DATABASE_HOST: database
      DATABASE_NAME: ${DB_NAME}
      DATABASE_USER: ${DB_USER}
      DATABASE_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_TIME_TO_LIVE: ${JWT_TIME_TO_LIVE:-3600}
      JWT_REFRESH_TIME_TO_LIVE: ${JWT_REFRESH_TIME_TO_LIVE:-604800}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      DEPLOY_COLOR: green
    depends_on:
      database:
        condition: service_healthy
    networks:
      - crm_network
    healthcheck:
      test: ["CMD", "php", "-r", "echo 'healthy';"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
    profiles:
      - green
      - all

  # ===========================================
  # Frontend - Blue Environment
  # ===========================================
  frontend-blue:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: crm_frontend_blue
    restart: always
    expose:
      - "3000"
    environment:
      NUXT_PUBLIC_API_BASE_URL: ${API_BASE_URL}
      NUXT_PUBLIC_APP_NAME: ${APP_NAME:-CRM 系統}
      NODE_ENV: production
      DEPLOY_COLOR: blue
    depends_on:
      - backend-blue
    networks:
      - crm_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
    profiles:
      - blue
      - all

  # ===========================================
  # Frontend - Green Environment
  # ===========================================
  frontend-green:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: crm_frontend_green
    restart: always
    expose:
      - "3000"
    environment:
      NUXT_PUBLIC_API_BASE_URL: ${API_BASE_URL}
      NUXT_PUBLIC_APP_NAME: ${APP_NAME:-CRM 系統}
      NODE_ENV: production
      DEPLOY_COLOR: green
    depends_on:
      - backend-green
    networks:
      - crm_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
    profiles:
      - green
      - all

  # ===========================================
  # Nginx Reverse Proxy (流量入口)
  # ===========================================
  nginx:
    image: nginx:alpine
    container_name: crm_nginx_prod
    restart: always
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./docker/nginx/ssl:/etc/nginx/ssl:ro
      - ./backend/public:/var/www/html/public:ro
    environment:
      - DEPLOY_COLOR=${DEPLOY_COLOR:-blue}
    depends_on:
      - backend-blue
      - frontend-blue
    networks:
      - crm_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

networks:
  crm_network:
    driver: bridge

volumes:
  db_data:
