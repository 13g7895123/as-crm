# ============================================
# Nginx 主配置 - CRM RBAC 藍綠部署
# ============================================

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # 日誌格式
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'upstream: $upstream_addr rt=$request_time';

    access_log /var/log/nginx/access.log main;

    # 效能設定
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Gzip 壓縮
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript 
               application/xml application/xml+rss text/javascript application/x-javascript;

    # 上游服務定義 - 藍色環境
    upstream backend_blue {
        server backend-blue:9000;
        keepalive 32;
    }

    upstream frontend_blue {
        server frontend-blue:3000;
        keepalive 32;
    }

    # 上游服務定義 - 綠色環境
    upstream backend_green {
        server backend-green:9000;
        keepalive 32;
    }

    upstream frontend_green {
        server frontend-green:3000;
        keepalive 32;
    }

    # 動態選擇 upstream（透過環境變數）
    # 預設使用藍色環境
    map $deploy_color $backend_upstream {
        default backend_blue;
        blue    backend_blue;
        green   backend_green;
    }

    map $deploy_color $frontend_upstream {
        default frontend_blue;
        blue    frontend_blue;
        green   frontend_green;
    }

    # 載入站點配置
    include /etc/nginx/conf.d/*.conf;
}
