name: Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        type: choice
        options:
          - staging
          - production
      skip_tests:
        description: 'Skip tests before deployment'
        required: false
        type: boolean
        default: false

  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'

jobs:
  test:
    name: Run Tests
    if: github.event.inputs.skip_tests != 'true'
    uses: ./.github/workflows/test.yml

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: test
    if: |
      github.event.inputs.environment == 'staging' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    environment:
      name: staging
      url: https://staging.example.com

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.8.0
        with:
          ssh-private-key: ${{ secrets.STAGING_SSH_KEY }}

      - name: Add server to known hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.STAGING_HOST }} >> ~/.ssh/known_hosts

      - name: Create deployment package
        run: |
          tar -czf deploy.tar.gz \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='vendor' \
            --exclude='tests' \
            --exclude='.env' \
            ./

      - name: Upload deployment package
        run: |
          scp deploy.tar.gz ${{ secrets.STAGING_USER }}@${{ secrets.STAGING_HOST }}:/tmp/

      - name: Deploy to staging server
        run: |
          ssh ${{ secrets.STAGING_USER }}@${{ secrets.STAGING_HOST }} << 'EOF'
            set -e

            # Configuration
            DEPLOY_PATH="${{ secrets.STAGING_DEPLOY_PATH }}"
            BACKUP_PATH="${{ secrets.STAGING_BACKUP_PATH }}"
            TIMESTAMP=$(date +%Y%m%d_%H%M%S)

            echo "========================================="
            echo "Deploying to Staging"
            echo "Timestamp: $TIMESTAMP"
            echo "========================================="

            # Create backup
            echo "Creating backup..."
            mkdir -p "$BACKUP_PATH"
            if [ -d "$DEPLOY_PATH" ]; then
              tar -czf "$BACKUP_PATH/backup_$TIMESTAMP.tar.gz" -C "$DEPLOY_PATH" .
              echo "Backup created: backup_$TIMESTAMP.tar.gz"
            fi

            # Extract new version
            echo "Extracting deployment package..."
            mkdir -p "$DEPLOY_PATH"
            tar -xzf /tmp/deploy.tar.gz -C "$DEPLOY_PATH"
            rm /tmp/deploy.tar.gz

            # Backend deployment
            echo "Setting up backend..."
            cd "$DEPLOY_PATH/backend"

            # Install dependencies
            composer install --no-dev --optimize-autoloader

            # Run migrations
            php spark migrate --all

            # Clear cache
            php spark cache:clear

            # Set permissions
            chmod -R 755 writable/
            chmod -R 777 writable/cache writable/logs writable/session

            # Frontend deployment
            echo "Setting up frontend..."
            cd "$DEPLOY_PATH/frontend"

            # Install dependencies
            npm ci --production

            # Build frontend
            npm run build

            # Restart services (adjust based on your setup)
            echo "Restarting services..."
            # sudo systemctl restart php8.1-fpm
            # sudo systemctl restart nginx
            # pm2 restart crm-frontend

            echo "========================================="
            echo "Deployment completed successfully!"
            echo "========================================="
          EOF

      - name: Run health check
        run: |
          echo "Running health check on staging..."
          sleep 10  # Wait for services to start

          # Check backend
          BACKEND_RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" ${{ secrets.STAGING_BACKEND_URL }}/api/v1/auth/login)
          if [ "$BACKEND_RESPONSE" -eq 405 ] || [ "$BACKEND_RESPONSE" -eq 401 ]; then
            echo "✓ Backend is responding (HTTP $BACKEND_RESPONSE)"
          else
            echo "✗ Backend health check failed (HTTP $BACKEND_RESPONSE)"
            exit 1
          fi

          # Check frontend
          FRONTEND_RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" ${{ secrets.STAGING_FRONTEND_URL }})
          if [ "$FRONTEND_RESPONSE" -eq 200 ]; then
            echo "✓ Frontend is responding (HTTP $FRONTEND_RESPONSE)"
          else
            echo "✗ Frontend health check failed (HTTP $FRONTEND_RESPONSE)"
            exit 1
          fi

      - name: Notify deployment success
        if: success()
        uses: 8398a7/action-slack@v3
        with:
          status: custom
          custom_payload: |
            {
              text: "Deployment to Staging Successful",
              attachments: [{
                color: 'good',
                text: `Deployed ${process.env.AS_COMMIT} to staging by ${process.env.AS_AUTHOR}`
              }]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

      - name: Notify deployment failure
        if: failure()
        uses: 8398a7/action-slack@v3
        with:
          status: custom
          custom_payload: |
            {
              text: "Deployment to Staging Failed",
              attachments: [{
                color: 'danger',
                text: `Failed to deploy ${process.env.AS_COMMIT} to staging`
              }]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: test
    if: github.event.inputs.environment == 'production'
    environment:
      name: production
      url: https://crm.example.com

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Confirm production deployment
        run: |
          echo "========================================="
          echo "WARNING: PRODUCTION DEPLOYMENT"
          echo "========================================="
          echo "Branch: ${{ github.ref_name }}"
          echo "Commit: ${{ github.sha }}"
          echo "Deployer: ${{ github.actor }}"
          echo "========================================="

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.8.0
        with:
          ssh-private-key: ${{ secrets.PRODUCTION_SSH_KEY }}

      - name: Add server to known hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.PRODUCTION_HOST }} >> ~/.ssh/known_hosts

      - name: Create deployment package
        run: |
          tar -czf deploy.tar.gz \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='vendor' \
            --exclude='tests' \
            --exclude='.env' \
            ./

      - name: Upload deployment package
        run: |
          scp deploy.tar.gz ${{ secrets.PRODUCTION_USER }}@${{ secrets.PRODUCTION_HOST }}:/tmp/

      - name: Deploy to production server
        run: |
          ssh ${{ secrets.PRODUCTION_USER }}@${{ secrets.PRODUCTION_HOST }} << 'EOF'
            set -e

            # Configuration
            DEPLOY_PATH="${{ secrets.PRODUCTION_DEPLOY_PATH }}"
            BACKUP_PATH="${{ secrets.PRODUCTION_BACKUP_PATH }}"
            TIMESTAMP=$(date +%Y%m%d_%H%M%S)

            echo "========================================="
            echo "Deploying to Production"
            echo "Timestamp: $TIMESTAMP"
            echo "========================================="

            # Create backup (CRITICAL for production)
            echo "Creating database backup..."
            bash "$DEPLOY_PATH/scripts/backup-database.sh" production

            echo "Creating application backup..."
            mkdir -p "$BACKUP_PATH"
            if [ -d "$DEPLOY_PATH" ]; then
              tar -czf "$BACKUP_PATH/backup_$TIMESTAMP.tar.gz" -C "$DEPLOY_PATH" .
              echo "Backup created: backup_$TIMESTAMP.tar.gz"
            fi

            # Extract new version
            echo "Extracting deployment package..."
            mkdir -p "$DEPLOY_PATH"
            tar -xzf /tmp/deploy.tar.gz -C "$DEPLOY_PATH"
            rm /tmp/deploy.tar.gz

            # Backend deployment
            echo "Setting up backend..."
            cd "$DEPLOY_PATH/backend"

            # Install dependencies
            composer install --no-dev --optimize-autoloader

            # Run migrations (with safety checks)
            php spark migrate --all

            # Clear cache
            php spark cache:clear

            # Set permissions
            chmod -R 755 writable/
            chmod -R 777 writable/cache writable/logs writable/session

            # Frontend deployment
            echo "Setting up frontend..."
            cd "$DEPLOY_PATH/frontend"

            # Install dependencies
            npm ci --production

            # Build frontend
            npm run build

            # Restart services
            echo "Restarting services..."
            sudo systemctl restart php8.1-fpm
            sudo systemctl restart nginx
            pm2 restart crm-frontend

            echo "========================================="
            echo "Production deployment completed!"
            echo "========================================="
          EOF

      - name: Run health check
        run: |
          echo "Running health check on production..."
          sleep 15  # Wait for services to start

          # Check backend
          BACKEND_RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" ${{ secrets.PRODUCTION_BACKEND_URL }}/api/v1/auth/login)
          if [ "$BACKEND_RESPONSE" -eq 405 ] || [ "$BACKEND_RESPONSE" -eq 401 ]; then
            echo "✓ Backend is responding (HTTP $BACKEND_RESPONSE)"
          else
            echo "✗ Backend health check failed (HTTP $BACKEND_RESPONSE)"
            echo "!!! ROLLBACK REQUIRED !!!"
            exit 1
          fi

          # Check frontend
          FRONTEND_RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" ${{ secrets.PRODUCTION_FRONTEND_URL }})
          if [ "$FRONTEND_RESPONSE" -eq 200 ]; then
            echo "✓ Frontend is responding (HTTP $FRONTEND_RESPONSE)"
          else
            echo "✗ Frontend health check failed (HTTP $FRONTEND_RESPONSE)"
            echo "!!! ROLLBACK REQUIRED !!!"
            exit 1
          fi

      - name: Notify deployment success
        if: success()
        uses: 8398a7/action-slack@v3
        with:
          status: custom
          custom_payload: |
            {
              text: "🚀 Production Deployment Successful",
              attachments: [{
                color: 'good',
                text: `Successfully deployed ${process.env.AS_COMMIT} to production by ${process.env.AS_AUTHOR}`
              }]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

      - name: Notify deployment failure
        if: failure()
        uses: 8398a7/action-slack@v3
        with:
          status: custom
          custom_payload: |
            {
              text: "🚨 Production Deployment Failed",
              attachments: [{
                color: 'danger',
                text: `Failed to deploy ${process.env.AS_COMMIT} to production - IMMEDIATE ACTION REQUIRED`
              }]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

  rollback:
    name: Rollback Deployment
    runs-on: ubuntu-latest
    if: failure()
    needs: [deploy-staging, deploy-production]

    steps:
      - name: Rollback instructions
        run: |
          echo "========================================="
          echo "DEPLOYMENT FAILED - ROLLBACK REQUIRED"
          echo "========================================="
          echo ""
          echo "To rollback, run the following on the server:"
          echo ""
          echo "1. Find the latest backup:"
          echo "   ls -lt /path/to/backups/"
          echo ""
          echo "2. Extract the backup:"
          echo "   tar -xzf backup_TIMESTAMP.tar.gz -C /path/to/deploy/"
          echo ""
          echo "3. Restore database (if needed):"
          echo "   mysql -u root -p database_name < backup.sql"
          echo ""
          echo "4. Restart services:"
          echo "   sudo systemctl restart php8.1-fpm nginx"
          echo "   pm2 restart crm-frontend"
          echo ""
          echo "========================================="
